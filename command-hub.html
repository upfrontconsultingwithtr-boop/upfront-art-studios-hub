<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Command Hub</title>
<main><h1>The Creative Command Hub is private</h1>
<p>If you previously used the Hub on this device, you can export its saved tasks and notes here.</p>
<button id="backup" hidden>Export saved Hub data</button><p id="status" role="status"></p>
<a href="/">Open Upfront Art Studios</a></main>
<script>
const backup = document.getElementById('backup');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
try {
  const saved = localStorage.getItem('upfront-art-hub-v1');
  backup.hidden = !saved;
  backup.onclick = () => {
    const url = URL.createObjectURL(new Blob([saved], {type:'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'upfront-art-hub-backup.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
} catch {
  document.getElementById('status').textContent = 'Browser storage is unavailable.';
}
</script></html>
